---
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: nginx-docker-monitoring

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus monitors itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Nginx metrics (nginx_*) via stub_status
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Per-container metrics (container_*)
  - job_name: cadvisor
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Drop high-cardinality metrics we never use, to keep the TSDB small
      - source_labels: [__name__]
        regex: container_(tasks_state|memory_failures_total|blkio_device_usage_total)
        action: drop

  # Host metrics (node_*)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
