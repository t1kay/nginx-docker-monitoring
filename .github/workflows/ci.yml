---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate configs, rules and dashboards
        run: bash scripts/check.sh

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: All Prometheus targets are up
        run: |
          for i in $(seq 1 20); do
            down=$(curl -s localhost:9090/api/v1/targets \
              | python3 -c "import sys,json; t=json.load(sys.stdin)['data']['activeTargets']; print(sum(x['health']!='up' for x in t))")
            [ "$down" = "0" ] && { echo "all targets up"; exit 0; }
            sleep 5
          done
          curl -s localhost:9090/api/v1/targets | python3 -m json.tool
          exit 1

      - name: Grafana has the provisioned dashboards
        run: |
          curl -sf -u admin:admin "localhost:3000/api/dashboards/uid/nginx-overview" > /dev/null
          curl -sf -u admin:admin "localhost:3000/api/dashboards/uid/containers-overview" > /dev/null

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Stop stack
        if: always()
        run: docker compose down -v
