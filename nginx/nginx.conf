worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    # Public site (published to host on :8080)
    server {
        listen 80;
        server_name _;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        # Endpoint that always returns 500, handy for testing error traffic
        location = /error {
            return 500 "simulated error\n";
        }
    }

    # Internal status endpoint for nginx-prometheus-exporter.
    # Port 8082 is NOT published in docker-compose.yml, so it is only
    # reachable from inside the Docker network.
    server {
        listen 8082;
        server_name _;
        access_log off;

        location = /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }
}
