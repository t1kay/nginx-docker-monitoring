---
# Alertmanager: groups alerts and routes them to receivers.
# By default alerts are only visible in the UI (http://localhost:9093).
# To receive Telegram messages, see the commented receiver below and README.

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
  # - name: telegram
  #   telegram_configs:
  #     - bot_token_file: /etc/alertmanager/telegram_token   # do NOT commit the token
  #       chat_id: 123456789
  #       parse_mode: HTML

inhibit_rules:
  # If Nginx itself is down, don't also notify about its high connections
  - source_matchers:
      - alertname="NginxDown"
    target_matchers:
      - alertname="NginxHighConnections"
    equal: [instance]
